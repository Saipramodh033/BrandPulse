# ==================================================================
# Docker Compose Configuration for BrandPulse
# ==================================================================
# Services:
#   - postgres: PostgreSQL 15 + pgvector extension
#   - worker: Autonomous agent + scheduler (Python)
#   - dashboard: Streamlit admin interface
# ==================================================================

services:
  # ================================================================
  # PostgreSQL Database with pgvector Extension
  # ================================================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: brandpulse_postgres
    restart: unless-stopped
    
    environment:
      # Database credentials (loaded from .env file)
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      # PostgreSQL configuration
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    
    volumes:
      # Persistent storage for database files
      - postgres_data:/var/lib/postgresql/data
      
      # Optional: Custom initialization scripts
      # - ./init-scripts:/docker-entrypoint-initdb.d
    
    ports:
      # Expose to host for debugging (optional, comment out for production)
      - "5432:5432"
    
    healthcheck:
      # Check if PostgreSQL is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - brandpulse_network

  # ================================================================
  # Redis (Celery Message Broker & Result Backend)
  # ================================================================
  redis:
    image: redis:7-alpine
    container_name: brandpulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - brandpulse_network

  # ================================================================
  # Worker Service (Autonomous Agent + Scheduler)
  # ================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    
    container_name: brandpulse_worker
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy  # Wait for PostgreSQL to be ready
      redis:
        condition: service_started
    
    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL}
      
      # Redis Connection for Celery
      REDIS_URL: redis://redis:6379/0
      
      # Google AI API
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      
      # Resend Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      SEND_EMAILS: ${SEND_EMAILS:-false}
      
      # Tavily Search API
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:-true}
      
      # Scheduler settings
      SCHEDULER_CHECK_INTERVAL: ${SCHEDULER_CHECK_INTERVAL}
      SCHEDULER_STARTUP_DELAY: ${SCHEDULER_STARTUP_DELAY:-10}
      
      # Application config
      MAX_PDF_SIZE_MB: ${MAX_PDF_SIZE_MB}
      LOG_LEVEL: ${LOG_LEVEL}
      
      # Python environment
      PYTHONUNBUFFERED: 1  # Real-time log output
    
    volumes:
      # Mount code for development (hot reload)
      - ./services:/app/services
      
      # Shared log directory
      - ./logs:/app/logs
      
      # Templates for email generation
      - ./templates:/app/templates
    
    networks:
      - brandpulse_network
    
    # Keep container running (scheduler runs in background)
    command: ["python", "services/worker/scheduler.py"]

  # ================================================================
  # API Service (FastAPI — Phase 2.5+)
  # ================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: brandpulse_api
    restart: unless-stopped
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Database connection
      DATABASE_URL: ${DATABASE_URL}

      # Redis Connection for Celery and WebSockets
      REDIS_URL: redis://redis:6379/0

      # API key auth (A2 Fix: leave empty to disable auth in dev)
      API_KEY: ${API_KEY:-}

      # Python environment
      PYTHONUNBUFFERED: 1

    ports:
      - "8000:8000"

    volumes:
      # Mount code for development (hot reload)
      - .:/app

    networks:
      - brandpulse_network

  # ================================================================
  # Frontend Service (Next.js - Phase 7)
  # ================================================================
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: brandpulse_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - brandpulse_network

# ==================================================================
# Volumes (Persistent Storage)
# ==================================================================
volumes:
  postgres_data:
    driver: local
    # Data persists even after 'docker-compose down'
    # To delete: 'docker-compose down -v'

# ==================================================================
# Networks (Internal Communication)
# ==================================================================
networks:
  brandpulse_network:
    driver: bridge
    # Services can communicate via service names
    # Example: postgres:5432, worker:8000